<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CompatibleFirst — native infographic system</title>
  <style>
    :root {
      --purple: #672DB7;
      --purple-2: #7C3AED;
      --purple-3: #8B5CF6;
      --purple-4: #A855F7;
      --purple-deep: #5B21B6;
      --ink: #101522;
      --muted: #57546a;
      --line: rgba(103,45,183,.86);
      --glass: rgba(255,255,255,.58);
      --glass-strong: rgba(255,255,255,.76);
      --border: rgba(255,255,255,.84);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: #f5f2fb; }
    #art { position: relative; overflow: hidden; isolation: isolate; background:
      radial-gradient(800px 560px at 5% 4%, rgba(255,255,255,.98), transparent 76%),
      radial-gradient(680px 580px at 96% 12%, rgba(184,155,224,.14), transparent 76%),
      radial-gradient(900px 520px at 48% 102%, rgba(118,72,184,.075), transparent 78%),
      linear-gradient(135deg, #fbfafd 0%, #f3f0f9 54%, #faf9fc 100%);
    }
    #art::before { content:""; position:absolute; width:620px; height:620px; left:calc(50% - 310px); top:130px; z-index:-2; border-radius:50%; background:rgba(255,255,255,.34); filter:blur(90px); }
    #art::after { display:none; }
    .horizontal, .ranked { width: 1600px; height: 900px; }
    .vertical { width: 1600px; height: 1320px; }
    .portrait { width: 1080px; height: 1960px; }

    h1, h2, h3, p { margin: 0; }
    .title { padding:30px 38px; border-radius:30px; text-align:left; background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(255,255,255,.42)); border:1.5px solid rgba(255,255,255,.88); box-shadow:0 24px 58px rgba(56,29,98,.08),inset 0 1px 0 white; backdrop-filter:blur(22px); }
    .headline { font-weight: 760; letter-spacing: -.052em; line-height: .98; }
    .headline .accent { color: var(--purple); }
    .subhead { color: #272337; font-size: 23px; letter-spacing: -.02em; }
    .tagline { color: var(--purple); font-size: 34px; font-weight: 760; letter-spacing: -.035em; }

    .brand { position:absolute; display:flex; align-items:center; gap:12px; }
    .brand .mark { display:block; width:66px; height:58px; object-fit:contain; }
    .wordmark { display:flex; align-items:baseline; white-space:nowrap; font-size:37px; line-height:.9; font-weight:760; letter-spacing:-.052em; color:var(--ink); }
    .wordmark .first { color:var(--purple); }
    .brand-copy { position:relative; padding-bottom:17px; }
    .dotcom { position:absolute; right:0; bottom:0; color:var(--ink); font-size:16px; line-height:1; font-weight:720; letter-spacing:-.02em; }

    .glass { background: linear-gradient(145deg, rgba(255,255,255,.76), rgba(255,255,255,.39)); border: 1.5px solid rgba(255,255,255,.88); box-shadow: 0 26px 60px rgba(48,25,86,.11), inset 0 1px 0 white, inset 0 -1px 0 rgba(103,45,183,.055); backdrop-filter: blur(24px); }
    .soft-panel { background: linear-gradient(150deg,rgba(255,255,255,.78),rgba(255,255,255,.47)); border: 1.25px solid rgba(255,255,255,.9); box-shadow: 0 16px 32px rgba(52,28,90,.075), inset 0 1px 0 white; backdrop-filter: blur(20px); }

    .orb { position:relative; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,.52), transparent 20%),
      radial-gradient(circle at 72% 78%, rgba(63,12,137,.72), transparent 45%),
      linear-gradient(145deg, #a95af0 0%, #7c3aed 38%, #672db7 67%, #49148d 100%);
      border: 1px solid rgba(255,255,255,.58); box-shadow: 0 14px 28px rgba(67,25,136,.22), inset 0 0 0 2px rgba(255,255,255,.10), inset 0 -12px 20px rgba(36,0,83,.16); }
    .orb::after { content:""; position:absolute; inset:7%; border-radius:50%; border:1px solid rgba(255,255,255,.24); }
    .orb svg { position:relative; z-index:2; width:49%; height:49%; fill:none; stroke:#fff; stroke-width:2.05; stroke-linecap:round; stroke-linejoin:round; filter: drop-shadow(0 2px 3px rgba(41,0,92,.32)); }

    .formula { display:flex; align-items:stretch; gap:18px; }
    .step { min-width:0; flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding: 24px 18px 22px; border-radius: 24px; }
    .step .orb { width:104px; height:104px; margin-bottom:17px; }
    .step h3 { font-size:22px; line-height:1.08; letter-spacing:-.035em; font-weight:750; }
    .step p { margin-top:9px; max-width:185px; font-size:16px; line-height:1.38; color:var(--muted); }
    .plus { align-self:center; color:var(--purple); font-size:38px; line-height:1; font-weight:800; }

    .user-card { position:absolute; border-radius:30px; padding:13px; }
    .user-photo { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:22px; display:block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
    .user-label { display:flex; align-items:center; justify-content:center; padding:14px 10px 6px; }
    .user-label strong { font-size:30px; color:var(--purple); letter-spacing:-.04em; }
    .score { position:absolute; display:grid; place-items:center; }
    .score-svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 20px 24px rgba(58,19,126,.13)); }
    .score-value { position:relative; z-index:2; color:#fff; font-weight:790; letter-spacing:-.055em; text-shadow:0 2px 5px rgba(38,0,82,.24); }

    .result { position:absolute; padding:7px; border-radius:25px; background:conic-gradient(from -90deg, #a855f7 0deg, #8b5cf6 83deg, #7c3aed 166deg, #672db7 249deg, #5b21b6 331deg, #d1d5db 334deg 360deg); box-shadow:0 24px 42px rgba(51,22,93,.22); }
    .result-inner { position:relative; width:100%; height:100%; border-radius:19px; overflow:hidden; background:#fff; }
    .result img.photo { width:100%; height:100%; object-fit:cover; display:block; }
    .result .photo-shade { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.76), transparent 43%); }
    .status { position:absolute; top:0; left:0; z-index:3; width:56px; height:54px; display:grid; place-items:center; border-radius:0 0 18px 0; background:rgba(255,255,255,.34); backdrop-filter:blur(12px); box-shadow: inset -1px -1px 0 rgba(255,255,255,.5); }
    .status img { width:34px; height:31px; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    .result-bottom { position:absolute; left:0; right:0; bottom:0; z-index:3; display:flex; align-items:flex-end; justify-content:space-between; color:#fff; }
    .result-name { min-width:0; padding:18px 12px 12px; font-size:21px; line-height:1; font-weight:750; text-shadow:0 1px 3px #000; }
    .result-score { flex:none; min-width:58px; padding:14px 10px 12px; border-radius:18px 0 0 0; text-align:center; font-size:18px; line-height:1; font-weight:760; background:rgba(255,255,255,.28); backdrop-filter:blur(12px); text-shadow:0 1px 3px #000; box-shadow:inset 1px 1px 0 rgba(255,255,255,.28); }

    .wire { position:absolute; inset:0; width:100%; height:100%; z-index:-.5; overflow:visible; }
    .wire path { fill:none; stroke:var(--line); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .wire circle { r:6px; fill:url(#nodeGradient); stroke:rgba(255,255,255,.78); stroke-width:1.5; }

    /* horizontal */
    .horizontal .brand { top:72px; right:52px; }
    .horizontal .title { position:absolute; top:38px; left:40px; width:930px; height:160px; }
    .horizontal .headline { font-size:64px; }
    .horizontal .subhead { margin-top:17px; }
    .horizontal .user-card { width:210px; top:314px; left:40px; }
    .horizontal .formula { position:absolute; width:720px; height:286px; top:300px; left:300px; padding:15px; border-radius:30px; }
    .horizontal .score { width:260px; height:260px; left:1060px; top:313px; }
    .horizontal .score-value { font-size:60px; }
    .horizontal .result { width:200px; height:200px; top:343px; left:1350px; }
    .horizontal .tagline { position:absolute; bottom:74px; width:100%; text-align:center; }

    /* vertical */
    .vertical .brand { top:70px; right:52px; }
    .vertical .title { position:absolute; top:32px; left:42px; width:860px; height:150px; }
    .vertical .headline { font-size:54px; }
    .vertical .subhead { margin-top:13px; }
    .vertical .user-card { width:210px; top:205px; left:695px; }
    .vertical .user-card .user-label { justify-content:center; }
    .vertical .formula { position:absolute; width:1030px; height:220px; top:480px; left:285px; padding:14px; border-radius:30px; }
    .vertical .step { flex-direction:row; text-align:left; gap:20px; padding:22px; }
    .vertical .step .orb { width:106px; height:106px; margin:0; }
    .vertical .step p { max-width:170px; }
    .vertical .plus { font-size:34px; }
    .vertical .score { width:250px; height:250px; left:675px; top:725px; }
    .vertical .score-value { font-size:58px; }
    .vertical .result { width:198px; height:198px; top:1000px; left:701px; }
    .vertical .tagline { position:absolute; bottom:34px; width:100%; text-align:center; }

    /* ranked */
    .ranked .brand { top:72px; right:52px; }
    .ranked .title { position:absolute; top:38px; left:40px; width:930px; height:160px; }
    .ranked .headline { font-size:62px; }
    .ranked .subhead { margin-top:16px; }
    .ranked .user-card { width:210px; top:300px; left:30px; }
    .ranked .formula { position:absolute; width:590px; height:270px; top:312px; left:280px; padding:14px; border-radius:30px; gap:10px; }
    .ranked .step { padding:18px 8px; }
    .ranked .step .orb { width:94px; height:94px; margin-bottom:14px; }
    .ranked .step h3 { font-size:18px; }
    .ranked .step p { font-size:14px; }
    .ranked .plus { font-size:30px; }
    .ranked .score { width:250px; height:250px; left:900px; top:321px; }
    .ranked .score-value { font-size:56px; }
    .ranked .result { width:154px; height:154px; left:1404px; }
    .ranked .r1 { top:222px; } .ranked .r2 { top:407px; } .ranked .r3 { top:592px; }
    .ranked .result .status { width:40px; height:39px; border-radius:0 0 13px 0; }
    .ranked .result .status img { width:25px; height:23px; }
    .ranked .result-name { padding:11px 7px 8px; font-size:14px; }
    .ranked .result-score { min-width:42px; padding:9px 6px 8px; border-radius:12px 0 0 0; font-size:12px; }
    .ranked .tagline { position:absolute; bottom:55px; width:100%; text-align:center; }

    /* portrait */
    .portrait .brand { top:40px; left:354px; }
    .portrait .brand .mark { width:72px; height:64px; }
    .portrait .wordmark { font-size:40px; }
    .portrait .title { position:absolute; top:142px; left:90px; width:900px; height:172px; text-align:center; }
    .portrait .headline { font-size:62px; }
    .portrait .subhead { margin-top:18px; font-size:22px; }
    .portrait .user-card { width:390px; top:350px; left:345px; display:grid; grid-template-columns:210px 1fr; gap:22px; padding:16px; }
    .portrait .user-card .user-photo { width:210px; }
    .portrait .user-card .user-label { align-items:center; justify-content:center; padding:0; }
    .portrait .formula { position:absolute; width:720px; height:470px; top:650px; left:180px; padding:20px; border-radius:34px; flex-direction:column; gap:12px; }
    .portrait .step { flex-direction:row; text-align:left; gap:30px; min-height:136px; padding:18px 26px; }
    .portrait .step .orb { width:106px; height:106px; margin:0; }
    .portrait .step h3 { font-size:28px; }
    .portrait .step p { font-size:19px; max-width:420px; }
    .portrait .plus { display:none; }
    .portrait .score { width:300px; height:300px; left:390px; top:1204px; }
    .portrait .score-value { font-size:76px; }
    .portrait .result { width:292px; height:292px; top:1560px; left:394px; padding:8px; border-radius:29px; }
    .portrait .result-inner { border-radius:22px; }
    .portrait .status { width:72px; height:70px; border-radius:0 0 22px 0; }
    .portrait .status img { width:42px; height:38px; }
    .portrait .result-name { padding:22px 15px 15px; font-size:25px; }
    .portrait .result-score { min-width:72px; padding:18px 12px 15px; font-size:22px; }
    .portrait .tagline { position:absolute; bottom:48px; width:100%; text-align:center; font-size:38px; }
  </style>
</head>
<body>
  <main id="art"></main>
  <script>
    const A='/assets/';
    const icons={
      questions:`<svg viewBox="0 0 48 48"><path d="M20 14h20M20 24h20M20 34h20"/><path d="m8.5 13 2.5 2.5 5-6M8.5 23l2.5 2.5 5-6M8.5 33l2.5 2.5 5-6"/></svg>`,
      math:`<svg viewBox="0 0 48 48"><path d="M8 16h28M30 10l6 6-6 6M40 32H12M18 26l-6 6 6 6"/></svg>`,
      sort:`<svg viewBox="0 0 48 48"><path d="M10 38V29M20 38V22M30 38V15M40 38V8"/><path d="m8 18 9 4 9-9 7 3 7-8"/></svg>`
    };
    const step=(kind,title,copy)=>`<section class="step soft-panel"><div class="orb">${icons[kind]}</div><div><h3>${title}</h3><p>${copy}</p></div></section>`;
    const formula=(klass='')=>`<section class="formula glass ${klass}">${step('questions','Questions','Answer questions that matter to you.')}<b class="plus">+</b>${step('math','Two-way math','Your preferences + their preferences.')}<b class="plus">+</b>${step('sort','Sort by compatibility','See the strongest matches first.')}</section>`;
    const brand=()=>`<div class="brand" aria-label="CompatibleFirst.com"><img class="mark" src="${A}mmlogox.png" alt=""><div class="brand-copy"><div class="wordmark"><span>Compatible</span><span class="first">First</span></div><span class="dotcom">.com</span></div></div>`;
    const user=(wide=false)=>`<section class="user-card glass"><img class="user-photo" src="${A}compatiblefirst-portrait-you-v10.png" alt="You"><div class="user-label"><strong>You</strong></div></section>`;
    const score=(pct)=>`<div class="score"><svg class="score-svg" viewBox="0 0 260 260" aria-hidden="true"><defs><radialGradient id="gemCore" cx="30%" cy="22%" r="82%"><stop offset="0" stop-color="#9D68E5"/><stop offset=".34" stop-color="#7840C9"/><stop offset=".7" stop-color="#54209C"/><stop offset="1" stop-color="#35106F"/></radialGradient><linearGradient id="gemNode" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#4C138F"/></linearGradient><clipPath id="gemClip"><circle cx="130" cy="130" r="84"/></clipPath></defs><circle cx="130" cy="130" r="119" fill="none" stroke="rgba(103,45,183,.09)" stroke-width="1"/><circle cx="130" cy="130" r="110" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="2"/><circle cx="130" cy="130" r="101" fill="none" stroke="rgba(103,45,183,.12)" stroke-width="1"/><circle cx="130" cy="130" r="94" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.72)" stroke-width="1.5"/><g clip-path="url(#gemClip)"><circle cx="130" cy="130" r="84" fill="url(#gemCore)"/><polygon points="130,46 184,68 156,130" fill="#A879EA" opacity=".24"/><polygon points="130,46 78,69 104,130" fill="#7D47C9" opacity=".26"/><polygon points="78,69 46,130 104,130" fill="#A26BE0" opacity=".19"/><polygon points="184,68 214,130 156,130" fill="#4D168D" opacity=".32"/><polygon points="46,130 79,188 104,130" fill="#6830B5" opacity=".34"/><polygon points="214,130 181,190 156,130" fill="#2D0965" opacity=".34"/><polygon points="79,188 130,214 104,130" fill="#512094" opacity=".34"/><polygon points="181,190 130,214 156,130" fill="#3C117A" opacity=".38"/><polygon points="104,130 130,46 156,130 130,214" fill="rgba(255,255,255,.065)"/><path d="M61 105L142 48M161 52L205 94M55 153L117 207" stroke="rgba(255,255,255,.11)" stroke-width="1"/></g><circle cx="130" cy="130" r="84" fill="none" stroke="rgba(255,255,255,.48)" stroke-width="1.2"/><g fill="url(#gemNode)" stroke="rgba(255,255,255,.78)" stroke-width="1"><circle cx="130" cy="10" r="6"/><circle cx="250" cy="130" r="6"/><circle cx="130" cy="250" r="6"/><circle cx="10" cy="130" r="6"/></g></svg><span class="score-value">${pct}%</span></div>`;
    const result=(name,pct,img,klass='')=>`<article class="result ${klass}"><div class="result-inner"><img class="photo" src="${A}${img}" alt="${name}"><div class="photo-shade"></div><div class="status"><img src="${A}check2.png" alt=""></div><div class="result-bottom"><div class="result-name">${name}</div><div class="result-score">${pct}%</div></div></div></article>`;
    const wireDefs=`<defs><linearGradient id="nodeGradient" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#5B21B6"/></linearGradient></defs>`;
    const title=(sub)=>`<header class="title"><h1 class="headline">Compatibility <span class="accent">Comes First</span></h1><p class="subhead">${sub}</p></header>`;

    function horizontal(){return `${brand()}${title('Your inputs shape every compatibility score.')}${user()}${formula()}${score(92)}${result('Alex, 29',92,'compatiblefirst-portrait-alex-v10.png')}<svg class="wire" viewBox="0 0 1600 900">${wireDefs}<path d="M250 443H300"/><circle cx="250" cy="443"/><circle cx="300" cy="443"/><path d="M1020 443H1070"/><circle cx="1020" cy="443"/><path d="M1310 443H1350"/><circle cx="1350" cy="443"/></svg><p class="tagline">Built from what matters to you.</p>`}
    function vertical(){return `${brand()}${title('Every score starts with your choices.')}${user()}${formula()}${score(92)}${result('Alex, 29',92,'compatiblefirst-portrait-alex-v10.png')}<svg class="wire" viewBox="0 0 1600 1320">${wireDefs}<path d="M800 465V480"/><circle cx="800" cy="465"/><circle cx="800" cy="480"/><path d="M800 700V735"/><circle cx="800" cy="700"/><path d="M800 965V1000"/><circle cx="800" cy="1000"/></svg><p class="tagline">Your answers shape the math.</p>`}
    function ranked(){return `${brand()}${title('Your inputs shape who rises to the top.')}${user()}${formula()}${score(94)}${result('Alex, 29',94,'compatiblefirst-portrait-alex-v10.png','r1')}${result('Marc, 31',88,'compatiblefirst-portrait-marc-v10.png','r2')}${result('Eli, 30',81,'compatiblefirst-portrait-eli-v10.png','r3')}<svg class="wire" viewBox="0 0 1600 900">${wireDefs}<path d="M240 440H280"/><circle cx="240" cy="440"/><circle cx="280" cy="440"/><path d="M870 446H910"/><circle cx="870" cy="446"/><path d="M1140 446H1248Q1266 446 1266 428V299Q1266 299 1284 299H1404M1266 446V484Q1266 484 1284 484H1404M1266 484V669Q1266 669 1284 669H1404"/><circle cx="1266" cy="446"/><circle cx="1404" cy="299"/><circle cx="1404" cy="484"/><circle cx="1404" cy="669"/></svg><p class="tagline">More answers. Clearer compatibility.</p>`}
    function portrait(){return `${brand()}${title('Your answers. Your preferences. Your compatibility.')}${user(true)}${formula()}${score(92)}${result('Alex, 29',92,'compatiblefirst-portrait-alex-v10.png')}<svg class="wire" viewBox="0 0 1080 1960">${wireDefs}<path d="M540 592V650"/><circle cx="540" cy="592"/><circle cx="540" cy="650"/><path d="M540 1120V1216"/><circle cx="540" cy="1120"/><path d="M540 1492V1560"/><circle cx="540" cy="1560"/></svg><p class="tagline">See where you align.</p>`}

    const variant=new URLSearchParams(location.search).get('variant')||'horizontal';
    const scale=Math.max(1,Number(new URLSearchParams(location.search).get('scale')||1));
    const art=document.getElementById('art');
    art.className=variant;
    art.innerHTML=({horizontal,vertical,ranked,portrait}[variant]||horizontal)();
    if(scale!==1){ art.style.zoom=String(scale); }
  </script>
</body>
</html>
