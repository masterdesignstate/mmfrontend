<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1672, initial-scale=1" />
  <title>CompatibleFirst ranked results</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1672px;
      height: 940px;
      margin: 0;
      overflow: hidden;
      background: #f8f6ff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .canvas {
      position: relative;
      width: 1672px;
      height: 940px;
      background: url('/assets/compatiblefirst-ranked-clean-base-v36.png') center / 100% 100% no-repeat;
    }
    .result-card {
      --score: 94;
      --p1: calc(var(--score) * .9deg);
      --p2: calc(var(--score) * 1.8deg);
      --p3: calc(var(--score) * 2.7deg);
      --p4: calc(var(--score) * 3.6deg);
      position: absolute;
      left: 1320px;
      width: 228px;
      height: 228px;
      padding: 4px;
      border-radius: 16px;
      background: conic-gradient(
        from -90deg,
        #a855f7 0deg,
        #8b5cf6 var(--p1),
        #7c3aed var(--p2),
        #672db7 var(--p3),
        #5b21b6 var(--p4),
        #5b21b6 calc(var(--p4) + 2deg),
        #d1d5db calc(var(--p4) + 3deg),
        #d1d5db 360deg
      );
      box-shadow: 0 12px 26px rgba(52, 31, 75, .20), 0 2px 8px rgba(91, 33, 182, .12);
    }
    .result-card::before {
      content: '';
      position: absolute;
      z-index: 5;
      left: -19px;
      top: calc(50% - 11px);
      width: 22px;
      height: 22px;
      border: 4px solid rgba(255, 255, 255, .92);
      border-radius: 50%;
      background: linear-gradient(145deg, #a855f7 0%, #7c3aed 52%, #5b21b6 100%);
      box-shadow: 0 0 0 1px rgba(124, 58, 237, .34), 0 3px 8px rgba(91, 33, 182, .22);
    }
    .result-card.alex { top: 109px; --score: 94; }
    .result-card.marcus { top: 358px; --score: 88; }
    .result-card.eli { top: 622px; --score: 81; }
    .junction {
      position: absolute;
      z-index: 4;
      width: 22px;
      height: 22px;
      border: 4px solid rgba(255, 255, 255, .94);
      border-radius: 50%;
      background: linear-gradient(145deg, #a855f7 0%, #7c3aed 52%, #5b21b6 100%);
      box-shadow: 0 0 0 1px rgba(124, 58, 237, .32), 0 3px 8px rgba(91, 33, 182, .20);
    }
    .junction.you { left: 310px; top: 460px; }
    .junction.formula { left: 900px; top: 460px; }
    .junction.branch-top { left: 1179px; top: 385px; }
    .junction.branch-middle { left: 1191px; top: 460px; }
    .junction.branch-bottom { left: 1179px; top: 530px; }
    .card-inner {
      position: relative;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      margin: 4px;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
    }
    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 46%;
    }
    .fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, .70), transparent 58%);
    }
    .status {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      display: flex;
      width: 40px;
      min-width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 0 0 12px 0;
      background: rgba(255, 255, 255, .25);
      box-shadow: inset -1px -1px 0 rgba(255, 255, 255, .28);
      backdrop-filter: blur(12px);
    }
    .status img {
      width: 25px;
      height: 23px;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .28));
    }
    .bottom-row {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      color: #fff;
    }
    .name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      padding: 12px 6px 6px 12px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    }
    .percentage {
      flex: none;
      padding: 8px 12px;
      border-radius: 16px 0 0 0;
      background: rgba(255, 255, 255, .25);
      backdrop-filter: blur(12px);
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <span class="junction you"></span>
    <span class="junction formula"></span>
    <span class="junction branch-top"></span>
    <span class="junction branch-middle"></span>
    <span class="junction branch-bottom"></span>

    <article class="result-card alex">
      <div class="card-inner">
        <img class="portrait" src="/assets/compatiblefirst-portrait-alex-v10.png" alt="Alex" />
        <div class="fade"></div>
        <div class="status"><img src="/assets/check2.png" alt="" /></div>
        <div class="bottom-row"><div class="name">Alex, 29</div><div class="percentage">94%</div></div>
      </div>
    </article>

    <article class="result-card marcus">
      <div class="card-inner">
        <img class="portrait" src="/assets/compatiblefirst-portrait-marc-v10.png" alt="Marcus" />
        <div class="fade"></div>
        <div class="status"><img src="/assets/check2.png" alt="" /></div>
        <div class="bottom-row"><div class="name">Marcus, 31</div><div class="percentage">88%</div></div>
      </div>
    </article>

    <article class="result-card eli">
      <div class="card-inner">
        <img class="portrait" src="/assets/compatiblefirst-portrait-eli-v10.png" alt="Eli" />
        <div class="fade"></div>
        <div class="status"><img src="/assets/check2.png" alt="" /></div>
        <div class="bottom-row"><div class="name">Eli, 30</div><div class="percentage">81%</div></div>
      </div>
    </article>
  </main>
</body>
<script>
  const offset = Number(new URLSearchParams(window.location.search).get('offset') || 0)
  document.querySelector('.canvas').style.transform = `translateX(-${offset}px)`
</script>
</html>
